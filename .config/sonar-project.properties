# Project Identifier for SonarQube
sonar.projectKey=gql-rs
sonar.projectName=gql-rs
sonar.projectVersion=0.0.1
sonar.organization=Ntur Lab

# Source and Test Directories
sonar.sources=src
sonar.tests=tests

# Language and Encoding
sonar.language=rust
sonar.sourceEncoding=UTF-8

# Path to the code coverage report (generated by cargo-llvm-cov)
sonar.rust.lcov.reportPaths=../target/code-coverage-gql-parser-report.txt

# Path to test execution report (generated by cargo nextest run)
sonar.junit.reportPaths=../target/nextest/default/gql-parser/unit-tests-report.xml

# Exclude autogenerated files from analysis
sonar.exclusions=src/antlr/**/*
