default:
  image: rust:1.97-slim-bookworm
  cache: &cargo_cache
    key:
      files:
        - Cargo.lock
      prefix: cargo-${CI_COMMIT_REF_SLUG}
    paths:
      - .cargo/registry/
      - .cargo/git/
      - target/

variables:
  CARGO_HOME: ${CI_PROJECT_DIR}/.cargo
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always

stages:
  - build
  - test

build:release:
  stage: build
  cache:
    <<: *cargo_cache
    policy: pull-push
  script:
    - cargo build --release --locked
    - cargo test --release --no-run --locked
  artifacts:
    name: release-${CI_COMMIT_SHORT_SHA}
    paths:
      - target/release/
    expire_in: 1 day

.test:release:
  stage: test
  needs:
    - job: build:release
      artifacts: true
  cache:
    <<: *cargo_cache
    policy: pull

test:tck:
  extends: .test:release
  script:
    - cargo test --release --locked --test gql_tck

test:unit:
  extends: .test:release
  script:
    - cargo test --release --locked --lib --test unit

test:integration:
  extends: .test:release
  script:
    - cargo test --release --locked --test integration --test ast_conformance
