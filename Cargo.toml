[package]
name = "gql-rs"
version = "0.0.1-alpha"
edition = "2024"
rust-version = "1.97"
authors = ["NTUR-LAB s.r.l."]
description = "GQL parser, typed AST builder, and semantic validator"
repository = "https://gitlab.com/inserpio/gql-rs"
documentation = "https://docs.rs/gql-rs"
readme = "README.md"
license = "EUPL-1.2"
keywords = ["gql", "graph", "parser", "ast"]
categories = ["parsing"]
exclude = [
    "/.config/",
    "/resources/",
    "/scripts/",
    "/.gitlab-ci.yml",
]

[dependencies]
antlr-rust = "0.3.0-beta"
serde = { version = "1.0.228", features = ["derive"] }

[dev-dependencies]
cucumber = "0.23.0"
libtest-mimic = "0.8.2"
serde_json = "1.0.145"
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread"] }

[[test]]
name = "gql_tck"
path = "tests/tck/main.rs"
harness = false

[[test]]
name = "ast_conformance"
path = "tests/fixtures/ast_conformance.rs"
harness = false

[[test]]
name = "integration"
path = "tests/integration/main.rs"
