[package]
name = "gql-parser"
version = "0.0.1-alpha"
edition = "2024"
authors = ["NTUR-LAB s.r.l."]
description = "GQL parser, typed AST builder, and semantic validator"
readme = "README.md"
license = "EUPL-1.2"
keywords = ["gql", "graph", "parser", "ast"]
categories = ["parsing"]

[dependencies]
# Parsing and AST construction.
antlr-rust = "0.3.0-beta"
# AST validation and error serialization.
serde = { version = "1.0.228", features = ["derive"] }

[dev-dependencies]
# Portable GQL feature files executed through the Cucumber runtime.
cucumber = "0.23.0"
libtest-mimic = "0.8.2"
serde_json = "1.0.145"
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread"] }

[build-dependencies]

[[test]]
name = "gql_tck"
path = "tests/integration/tck/main.rs"
harness = false

[[test]]
name = "ast_conformance"
path = "tests/integration/fixtures/ast_conformance.rs"
harness = false

[[test]]
name = "unit"
path = "tests/unit/main.rs"

[[test]]
name = "integration"
path = "tests/integration/main.rs"
