MATCH (n)
RETURN CAST(n.a AS INT8 NOT NULL) AS a, CAST(n.b AS UINT256) AS b, CAST(n.c AS INT(16)) AS c, CAST(n.d AS UNSIGNED BIG INTEGER) AS d, CAST(n.e AS SIGNED SMALL INTEGER) AS e, CAST(n.f AS DECIMAL(10, 2)) AS f, CAST(n.g AS FLOAT(24, 2)) AS g, CAST(n.h AS DOUBLE PRECISION) AS h, CAST(n.i AS FLOAT16) AS i
